deployment:
  mode: remote
  endpoint: null
  auth: oauth
  verified: searched
  note: >-
    Zoho ships a first-party hosted MCP product ("Zoho MCP") whose own marketing
    page names Zoho CRM as a supported app and describes OAuth-based, permission-
    scoped authorization plus a built-in playground. It is a REMOTE server, not a
    stdio package: there is no npx/pip install anywhere in Zoho's docs or on npm.
    The endpoint URL is NOT recorded because Zoho does not publish one. The console
    at https://mcp.zoho.com/ 302s to
    https://accounts.zoho.com/login?servicename=ZohoMCP..., and each connector URL
    appears to be minted per account inside that console. Every anonymous probe of
    a plausible path (/mcp, /mcp/v1, /baas/mcp/v1, /sse, /api/mcp, /crm/mcp) returned
    Zoho's own JSON 404 (INVALID_URL_PATTERN), and /.well-known/oauth-authorization-server
    and /.well-known/oauth-protected-resource both returned 400 "Invalid request uri."
    Per the no-fabrication rule an endpoint is left null rather than guessed.
