generated: '2026-08-13'
method: derived
source: >-
  openapi/ (105 first-party Zoho CRM OAS 3.1.0 files from github.com/zoho/crm-oas),
  mcp/zoho-crm-mcp.yml, graphql/zoho-crm-schema.graphql
note: >-
  Zoho publishes a hosted MCP product that covers Zoho CRM, but the connector URL is
  minted inside an auth-gated console, so tools/list could not be called and the real
  tool names + inputSchemas are NOT known. This crosswalk therefore does the honest
  half: it records the surfaces, and it binds the ONE tool invocation Zoho itself
  publishes (the worked example on https://www.zoho.com/mcp/, a POST of a Lead record
  to https://www.zohoapis.com/crm/v2/Leads) to its backing OpenAPI operation. Every
  other row is a capability the MCP layer must reach through some tool, mapped by
  semantics with confidence: low, and clearly labelled as unverified. No tool name is
  invented — rows whose tool name is unknown carry `tool: null`.
surfaces:
  openapi:
    files: 105
    operations: 405
    source: https://github.com/zoho/crm-oas
    gated: false
  mcp:
    product: https://www.zoho.com/mcp/
    console: https://mcp.zoho.com/
    endpoint: null
    gated: true
    reason: connector URL issued per account behind accounts.zoho.com login; tools/list unreachable anonymously
  graphql:
    endpoint: null
    file: graphql/zoho-crm-schema.graphql
    gated: true
    reason: >-
      Zoho CRM publishes no public GraphQL endpoint; the schema in graphql/ is an
      API Evangelist-derived model of the REST data core, not a provider surface, so
      it contributes no graphql-only rows here.
crosswalk:
- tool: null
  category: records
  capability: Create a record in a CRM module
  rest: [createRecords]
  spec: openapi/zoho-crm-record-openapi.json
  binding: rest
  confidence: high
  note: >-
    The only provider-published MCP tool invocation. Zoho's own "How it works"
    example shows the MCP tool executing POST https://www.zohoapis.com/crm/v2/Leads
    with a record body — the v8 equivalent is POST /{module} => createRecords. Tool
    NAME is not published, hence null.
- tool: null
  category: records
  capability: Read / list records in a module
  rest: [getRecords, getRecord]
  spec: openapi/zoho-crm-record-openapi.json
  binding: rest
  confidence: low
  note: unverified — inferred from the "search the desk / monitor deal progress" prompts on zoho.com/mcp, not from a fetched tool manifest
- tool: null
  category: records
  capability: Update a record (e.g. "mark the Zylker deal as won")
  rest: [updateRecord, updateRecords]
  spec: openapi/zoho-crm-record-openapi.json
  binding: rest
  confidence: low
  note: unverified — matches the published sample prompt "Mark the Zylker deal as won"
- tool: null
  category: activities
  capability: Schedule a call / meeting against a record
  rest: [postAppointmentsS]
  spec: openapi/zoho-crm-appointments-openapi.json
  binding: rest
  confidence: low
  note: unverified — matches the published sample prompt "schedule a call with John for an onboarding meeting"
- tool: null
  category: search
  capability: Search records by criteria/email/phone/word
  rest: [searchRecords]
  spec: openapi/zoho-crm-module-search-openapi.json
  binding: rest
  confidence: low
  note: unverified
- tool: null
  category: metadata
  capability: Discover module API names before acting
  rest: [getModules]
  spec: openapi/zoho-crm-modules-openapi.json
  binding: rest
  confidence: low
  note: >-
    Zoho's OAS page tells integrators to call the modules-metadata API to resolve the
    {module_API_name} placeholder in every scope, so an agent surface almost certainly
    exposes it — but it is inference, not an observed tool.
