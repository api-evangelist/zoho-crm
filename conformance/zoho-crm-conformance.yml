standards:
- id: openapi-3.1
  conforms: true
  evidence: >-
    All 105 published files declare "openapi": "3.1.0" (the docs page calls it
    "OAS 3.0.0"; the artifacts are 3.1.0). 405 operations, 864 component schemas,
    every operation carrying an operationId and a security[] requirement.
- id: oauth2
  conforms: true
  evidence: >-
    components.securitySchemes.iam-oauth2-schema type oauth2 in every spec;
    authorizationCode flow with authorizationUrl https://accounts.zoho.com/oauth/v2/auth,
    tokenUrl and refreshUrl https://accounts.zoho.com/oauth/v2/token, 458 distinct scopes.
- id: oidc
  conforms: true
  evidence: >-
    https://accounts.zoho.com/.well-known/openid-configuration returns 200 with a
    complete OIDC Discovery 1.0 document (issuer, jwks_uri, userinfo, id_token
    RS256/RS384, claims_supported).
- id: rfc6749-authorization-code
  conforms: true
  evidence: grant_types_supported includes authorization_code, refresh_token, implicit.
- id: rfc7636-pkce
  conforms: true
  evidence: code_challenge_methods_supported [plain, S256] in the OIDC discovery document.
- id: rfc7662-token-introspection
  conforms: true
  evidence: introspection_endpoint https://accounts.zoho.com/oauth/v2/introspect (client_secret_basic).
- id: rfc7009-token-revocation
  conforms: true
  evidence: revocation_endpoint https://accounts.zoho.com/oauth/v2/token/revoke.
- id: rfc8628-device-authorization-grant
  conforms: true
  evidence: device_authorization_endpoint https://accounts.zoho.com/oauth/v3/device/code; grant type urn:ietf:params:oauth:grant-type:device_code.
- id: rfc7523-jwt-bearer
  conforms: true
  evidence: grant_types_supported includes urn:ietf:params:oauth:grant-type:jwt-bearer; token_endpoint_auth_methods_supported includes private_key_jwt.
- id: rfc6750-bearer-token
  conforms: false
  evidence: >-
    Zoho does NOT use the Bearer scheme. The Authorization header is
    "Zoho-oauthtoken {access_token}", a vendor prefix, so generic RFC 6750 clients
    fail on the first call.
- id: rfc9116-security-txt
  conforms: true
  evidence: https://www.zoho.com/.well-known/security.txt returns 200 with Contact, Policy, Encryption, Acknowledgements, Canonical, Preferred-Languages and Expires.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    No operation across the 105 specs declares application/problem+json; every error
    body is application/json carrying Zoho's own {code, status, message, details}
    envelope.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header is documented and no operation is marked deprecated.
- id: rfc9110-conditional-requests
  conforms: true
  evidence: If-Modified-Since request header documented with 304 Not Modified and 412 Precondition Failed responses declared in openapi/zoho-crm-record-openapi.json.
- id: rfc8615-well-known
  conforms: true
  evidence: security.txt and openid-configuration served under /.well-known/ on zoho.com and accounts.zoho.com respectively.
- id: asyncapi-2.6
  conforms: partial
  evidence: >-
    asyncapi/zoho-crm-notifications-asyncapi.yml is an API Evangelist-authored 2.6.0
    model of Zoho's documented Instant Notifications callbacks; Zoho itself publishes
    no AsyncAPI document.
- id: json-api
  conforms: false
  evidence: Response envelope is {data, info}, not the JSON:API media type or structure.
- id: odata
  conforms: false
- id: scim2
  conforms: false
