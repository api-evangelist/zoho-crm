note: 'Derived mechanically from $ref links between component schemas across all 105 published specs. Zoho CRM''s
  real data core is dynamic: the record APIs are templated on {module} and the field set of any module is defined
  at runtime by the Fields/Layouts metadata APIs, so the strongest ''entities'' in the static contract are the metadata
  objects (fields, layouts, modules, profiles, roles, territories), not the business records. An agent must call
  getModules and getFields before it can construct a valid record body. Business modules (Leads, Contacts, Accounts,
  Deals, Tasks, Calls, Events, Products, Quotes, Invoices, ...) are addressed by API name through the {module} path
  parameter and are enumerated in the OAuth scope list, not as distinct schemas.'
