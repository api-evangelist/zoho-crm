source: https://help.zoho.com/portal/en/kb/crm/developer-guide/sandbox/articles/sandbox-overview
summary: >-
  Zoho CRM ships a real sandbox, but it is an ISOLATED ORG COPY, not a test MODE of
  the production API. There is no test/live key prefix, no magic test values, no test
  clock, and no shared demo credentials — you provision a sandbox org from your own
  CRM account and then point your integration at the sandbox host with tokens issued
  for that org. Nothing in this file is a published test credential, because Zoho
  publishes none.
model: isolated-org-copy
separation:
  key_prefix_test_vs_live: null
  mode_flag: null
  note: >-
    Zoho does not distinguish test from live by key prefix or a mode header. The
    separation is by HOST and by org.
hosts:
- host: https://sandbox.zohoapis.com
  role: sandbox API host
  probe:
    url: https://sandbox.zohoapis.com/crm/v8/settings/modules
    status: 401
