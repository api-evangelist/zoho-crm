generated: '2026-08-13'
method: probed
source: live GET of /.well-known/* on every apis.yml host and every OpenAPI servers[] host
note: >-
  Two real documents are served: an RFC 9116 security.txt on the marketing/docs host
  (www.zoho.com) and an OpenID Connect discovery document on the identity host
  (accounts.zoho.com), which is the authorization server every Zoho CRM OpenAPI
  securityScheme points at. The API host itself (www.zohoapis.com) serves no
  /.well-known/ surface — every path there returns the API gateway's own JSON
  404 ("API endpoint not found"), not an HTML shell.
hosts:
- host: https://www.zoho.com
  role: website / developer docs
  documents:
  - path: /.well-known/security.txt
    status: 200
    file: zoho-crm-security.txt
    kind: RFC 9116 security.txt
  - path: /.well-known/openid-configuration
    status: 404
  - path: /.well-known/oauth-authorization-server
