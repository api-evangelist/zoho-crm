  metric: concurrent_calls
  limit: 20
  name: Enterprise / Zoho One concurrent_calls per-org-per-app
  limit_text: Enterprise/Zoho One 20
- scope: per-org-per-app
  edition: Ultimate / CRM Plus
  metric: concurrent_calls
  limit: 25
  name: Ultimate / CRM Plus concurrent_calls per-org-per-app
  limit_text: Ultimate/CRM Plus 25
- scope: per-endpoint-class
  edition: all
  metric: sub_concurrency
  limit: 10
  note: '"The sub-concurrency limit for the above APIs is 10 for all the CRM editions."'
  name: all sub_concurrency per-endpoint-class
  limit_text: The sub-concurrency limit for the above APIs is 10 for all the CRM editions.
- scope: per-call
  metric: credit_cost
  limit: 1
  note: Baseline cost of a standard call. Insert/update/upsert cost 1 credit per 10 records; Convert Lead costs 5 credits;
    Bulk Write Initialize and Create Custom Module cost 500 credits each.
  name: credit_cost per-call
  limit_text: Each API call made will result in a reduction of 1 credit.
headers:
- name: X-API-CREDITS-REMAINING
  direction: response
  emitted_when: usage for the 24-hour window reaches 50% or above
  note: This is the only rate-limit signal Zoho documents on the response. There is no X-RateLimit-Limit / RateLimit-* / Retry-After
    documented, so an agent gets a remaining-credits number only after it is already halfway through the day's budget, and
    gets no reset timestamp at all.
exhaustion:
  http_status: 429
  meaning: '"Number of API requests for the 24 hour period is exceeded or the concurrency limit of the user for the app is
    exceeded." (status-codes.html)'
  error_keyword: TOO_MANY_REQUESTS
  retry_after_header: false
