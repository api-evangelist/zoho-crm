method: searched
source: https://www.zoho.com/crm/developer/docs/api/v8/api-limits.html
name: Zoho CRM API Rate Limits
model: credits
model_note: Zoho CRM does not meter raw request counts. It meters API CREDITS on a rolling 24-hour window per org, and separately
  caps SIMULTANEOUS active calls (concurrency) per org per connected app. Most calls cost 1 credit; some cost far more (bulk
  write initialize and custom-module creation are 500 credits each).
limit_count: 12
window: rolling 24 hours from the start of the call
limits:
- scope: per-org-per-day
  edition: Free
  metric: api_credits
  window: 24h rolling
  limit: 5000
  maximum: 5000
  name: Free api_credits per-org-per-day
  limit_text: Free Edition 5000 credits 5000 credits
- scope: per-org-per-day
  edition: Standard / Starter
  metric: api_credits
  window: 24h rolling
  limit: 50000 + (users x 250) + add-ons
  maximum: 100000
  name: Standard / Starter api_credits per-org-per-day
  limit_text: Standard/Starter Edition 50,000 credits + (Number of User licenses x 250) + Add-on credits 100,000 credits
- scope: per-org-per-day
  edition: Professional
  metric: api_credits
  window: 24h rolling
  limit: 50000 + (users x 500) + add-ons
  maximum: 3000000
  name: Professional api_credits per-org-per-day
  limit_text: Professional 50,000 credits + (Number of User licenses x 500) + Add-on credits 3,000,000 credits
- scope: per-org-per-day
  edition: Enterprise / Zoho One
  metric: api_credits
  window: 24h rolling
  limit: 50000 + (users x 1000) + add-ons
  maximum: 5000000
  name: Enterprise / Zoho One api_credits per-org-per-day
  limit_text: Enterprise/Zoho One 50,000 credits + (Number of User licenses x 1000) + Add-on credits 5,000,000 credits
- scope: per-org-per-day
  edition: Ultimate / CRM Plus
  metric: api_credits
  window: 24h rolling
  limit: 50000 + (users x 2000) + add-ons
  maximum: unlimited
  name: Ultimate / CRM Plus api_credits per-org-per-day
  limit_text: Ultimate/CRM Plus 50,000 credits + (Number of User licenses x 2000) + Add-on credits Unlimited
- scope: per-org-per-app
  edition: Free
  metric: concurrent_calls
  limit: 5
  name: Free concurrent_calls per-org-per-app
  limit_text: Free 5
- scope: per-org-per-app
  edition: Standard / Starter
  metric: concurrent_calls
  limit: 10
  name: Standard / Starter concurrent_calls per-org-per-app
  limit_text: Standard/Starter 10
- scope: per-org-per-app
