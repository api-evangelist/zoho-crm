x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 239
  artifacts_updated: 3
  pass: local-v1
  note: >-
    Zoho publishes first-party OpenAPI 3.1.0 for the whole Zoho CRM v8 surface at
    github.com/zoho/crm-oas, linked from
    zoho.com/crm/developer/docs/api/v8/openapi-specification.html. 105 specs / 405
    operations / 458 OAuth scopes were harvested verbatim, replacing three
    hand-scaffolded 2-operation specs and the two Postman collections derived from
    them. No agent card is served on any host; no idempotency key and no deprecation
    policy are published, so those pointers are deliberately absent.
