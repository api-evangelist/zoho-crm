aid: zoho-crm
name: Zoho CRM
description: Zoho CRM is Zoho Corporation's AI-powered sales and customer relationship management platform, used
  to manage leads, contacts, accounts, deals, activities and customer engagement across channels. Its REST API is
  currently at v8 and is published as first-party OpenAPI 3.1.0 — 105 specification files covering 405 operations,
  hosted by Zoho at github.com/zoho/crm-oas and linked from the developer documentation. Authentication is OAuth
  2.0 authorization-code against accounts.zoho.com with 458 distinct scopes, and every specification templates both
  the data centre and the API version into the server URL (https://zohoapis.{dc}/crm/{version}, dc one of com, eu,
  in, cn, au). Usage is metered in API credits on a rolling 24-hour window rather than in requests, alongside an
  org-level concurrency cap. Zoho additionally ships server-side SDKs for Node.js, TypeScript, Python, PHP, C#,
  Java, Ruby and Scala, a widget/extension CLI (ZET), a documented webhook surface (Instant Notifications), and
  a hosted MCP product that names Zoho CRM as a supported app.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-service
  trial: true
  try_now: true
  public: true
  label: Freemium, self-service
  confidence: high
  source:
  - https://www.zoho.com/crm/zohocrm-pricing.html
  - https://www.zoho.com/crm/signup.html
  - https://api-console.zoho.com/
  generated: '2026-08-13'
  method: searched
  note: Free edition for up to 3 users with a 5,000 API-credit daily budget; every paid edition CTA is a free trial;
    OAuth clients are self-service in the Zoho API Console.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/zoho-crm.png
