  highlights:
    additions:
    - Get Related Records Count of a Record
    - Rich Text Fields retrieval
    - Recycle Bin APIs (restore, empty)
    - Record-level email sharing / unsharing
    - Data Sharing Rules management (create, retrieve, activate, filter)
    - Calls Preferences APIs (From / To number fields)
    - Deal linking and unlinking for contact emails
    - Workflow management APIs (create, update, delete, reorder)
    - Connected Workflows end-to-end management
    - Action APIs — Field Updates, Email Notifications, Automation Tasks, Webhooks
    - Blueprint APIs (process states and transitions)
    - Kiosk APIs (form configuration and execution)
    - Calendar APIs (view and preference management)
    - Assignment Threshold APIs
    - Zia Assistant API for context-aware AI queries
    enhanced:
