dated_note: >-
  Zoho does not publish a DATED API changelog. The only API-change surface is a
  "What's New in V8" page organised by feature area with no release dates and no
  breaking-change section, so entries below carry the version they belong to but no
  date. Dated product-level notes appear on the Zoho CRM blog as quarterly "Zoho CRM
  QN 20NN Update" posts (mirrored in blogs/), which are product releases rather than
  API contract changes.
