generated: '2026-08-13'
method: searched
source: https://www.zoho.com/crm/developer/docs/api/v8/status-codes.html
derived_from: openapi/ (105 first-party Zoho CRM OAS 3.1.0 files, 1069 declared JSON responses)
format: vendor-json
format_note: >-
  NOT RFC 9457. No operation in any of the 105 published specs declares
  application/problem+json — every error body is application/json carrying Zoho's
  own envelope. An agent cannot rely on `type`/`title`/`detail`/`instance`.
envelope:
  media_type: application/json
  fields:
  - name: code
    description: Machine-readable error keyword, e.g. INVALID_DATA, MANDATORY_NOT_FOUND, ALREADY_ACTIVATED, TOO_MANY_REQUESTS.
  - name: status
    description: '"error" or "success" — present per-record in multi-record responses.'
  - name: message
    description: Human-readable message.
  - name: details
    description: Object carrying the offending field/resource; frequently empty {}.
  partial_success:
    http_status: 207
    description: >-
      Multi-Status. Batch write operations return a data[] array where each element
      carries its own code/status/message, so a 2xx does NOT mean every record
      succeeded. This is the single most important error-handling rule on this API
      and the one most likely to be missed by an agent that only checks the HTTP
      status.
